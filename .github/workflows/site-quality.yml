name: Site Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check tools/build-site.cjs
          node --check tools/fix-site.cjs
          node --check tools/inject-seo-internal-links.cjs
          node --check tools/inject-gtm.cjs
          node --check tools/audit-site.cjs
          node --check tools/audit-link-graph.cjs
          node --check assets/js/site.js

      - name: Build and normalize site
        run: |
          node tools/fix-site.cjs
          node tools/inject-seo-internal-links.cjs
          node tools/inject-gtm.cjs

      - name: Verify primary sitemap contract
        run: |
          grep -Fx "Sitemap: https://formakutusu.com/sitemap.txt" robots.txt

      - name: Audit production HTML, CSS, JavaScript, links and SEO
        run: node tools/audit-site.cjs

      - name: Audit internal link graph and crawl depth
        run: node tools/audit-link-graph.cjs

      - name: Commit generated fixes to pull request
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply repository-wide site audit corrections"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify repository is reproducible
        run: git diff --exit-code
