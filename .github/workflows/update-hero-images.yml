name: Ana sayfa hero görsellerini güncelle

on:
  push:
    branches:
      - main
    paths:
      - .hero-trigger-v2/**

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Ana dalı al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Görseli ve HTML'i güncelle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/hero
          cat \
            .hero-upload-v2/duo.01.b64 \
            .hero-upload-v2/duo.02.b64 \
            .hero-upload-v2/duo.03.b64 \
            .hero-upload-v2/duo.04.b64 \
            > /tmp/hero-nora-duo.b64

          test "$(wc -c < /tmp/hero-nora-duo.b64)" -eq 46056

          python3 - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          encoded = Path('/tmp/hero-nora-duo.b64').read_text(encoding='ascii')
          image = base64.b64decode(encoded, validate=True)
          if len(image) != 34540:
              raise SystemExit(f'Beklenmeyen görsel boyutu: {len(image)}')
          digest = hashlib.sha256(image).hexdigest()
          if digest != '7b9e9ba189737063bdb0bcd191662a40db529a659c8abbbfd802c8c444eb4e66':
              raise SystemExit(f'Görsel doğrulaması başarısız: {digest}')
          Path('assets/hero/hero-nora-duo.webp').write_bytes(image)

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text, preload_count = re.subn(
              r'<link rel="preload" href="/assets/models/fk-007-640\.webp"[^>]*>',
              '<link rel="preload" href="/assets/hero/hero-nora-duo.webp?v=20260804" as="image" fetchpriority="high">',
              text,
              count=1,
          )
          text, back_count = re.subn(
              r'<img class="fk-hero__model fk-hero__model--back"[^>]*>',
              '<img class="fk-hero__model fk-hero__model--back" src="/assets/hero/hero-nora-duo.webp?v=20260804" alt="NORA özel üretim formalarını giyen futbolcu" width="600" height="800" loading="eager" style="object-position: 82% 45%;">',
              text,
              count=1,
          )
          text, front_count = re.subn(
              r'<img class="fk-hero__model fk-hero__model--front"[^>]*>',
              '<img class="fk-hero__model fk-hero__model--front" src="/assets/hero/hero-nora-duo.webp?v=20260804" alt="NORA özel üretim formalarını giyen iki futbolcu" width="600" height="800" loading="eager" fetchpriority="high" style="object-position: 38% 45%;">',
              text,
              count=1,
          )

          if (preload_count, back_count, front_count) != (1, 1, 1):
              raise SystemExit(
                  f'HTML hedefleri bulunamadı: preload={preload_count}, back={back_count}, front={front_count}'
              )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Değişiklikleri kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/hero/hero-nora-duo.webp
          git rm -r --ignore-unmatch \
            .hero-upload \
            .hero-upload-v2 \
            .hero-trigger-v2 \
            .github/workflows/update-hero-images.yml
          git commit -m "Ana sayfa hero görsellerini NORA fotoğrafıyla güncelle [skip ci]"
          git push origin main
