name: Hero görsel tekrarını düzelt

on:
  push:
    branches:
      - main
    paths:
      - .hero-fix/**

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Ana dalı al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Hero görsel tekrarını kaldır
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacement = '<img class="fk-hero__model fk-hero__model--back" src="/assets/models/fk-031.webp?v=20260805" alt="FK-031 özel futbol forma modeli" width="640" height="800" loading="eager" style="object-position: 50% 45%;">'
          text, count = re.subn(
              r'<img class="fk-hero__model fk-hero__model--back"[^>]*>',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Hero arka görsel satırı bulunamadı: {count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Değişikliği kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -r --ignore-unmatch .hero-fix .github/workflows/fix-hero-duplicate.yml
          git commit -m "Hero görsellerindeki tekrarı gider"
          git push origin main
